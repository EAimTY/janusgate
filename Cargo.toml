[package]
name = "janusgate"
version = "0.0.0"
edition = "2024"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 3

[dependencies]
deref-once-lock = { version = "0.1.0", default-features = false }
host-port-pair = { version = "0.2.3", default-features = false, features = ["serde"] }
json-strip-comments = { version = "3.1.2", default-features = false }
lexopt = { version = "0.3.2", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread"] }

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
missing_panics_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
