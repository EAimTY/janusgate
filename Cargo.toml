[package]
name = "janusgate"
version = "0.0.0"
edition = "2024"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 3

# for faster `cargo check`
[profile.dev.build-override]
opt-level = 3
debug = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["original-uri"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
deref-once-lock = { version = "0.1.0", default-features = false }
futures = { version = "0.3.34", default-features = false }
host-port-pair = { version = "0.2.3", default-features = false, features = ["serde"] }
hserver = { version = "0.1.1", default-features = false, features = ["http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
json-strip-comments = { version = "3.1.2", default-features = false }
lexopt = { version = "0.3.2", default-features = false }
rand = { version = "0.10.2", default-features = false, features = ["std", "thread_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "json", "rustls", "stream"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
serde_with = { version = "3.23", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
socket2 = { version = "0.6.5", default-features = false }
subtle = { version = "2.6.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
turso = { version = "0.8.0-pre.9", default-features = false }
uuid = { version = "1.26.1", default-features = false, features = ["v4"] }

[build-dependencies]
blake3 = { version = "1.8.7", default-features = false }
syntaqlite = { version = "0.9.0", default-features = false, features = ["fmt", "sqlite"] }

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
missing_panics_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
