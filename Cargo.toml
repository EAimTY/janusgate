[package]
name = "janusgate"
version = "0.0.0"
edition = "2024"
default-run = "janusgate"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 3

# for faster `cargo check`
[profile.dev.build-override]
opt-level = 3
debug = false

[features]
# TypeScript bindings machinery for the management API: the linkme route
# registry and the ts-rs payload derives. The normal server build never
# enables it, so neither dependency is compiled in.
management-api-typescript-bindings = ["dep:linkme", "dep:ts-rs"]

[[bin]]
name = "generate-management-api-typescript-bindings"
path = "src/bin/generate_management_api_typescript_bindings.rs"
required-features = ["management-api-typescript-bindings"]

[dependencies]
arc-swap = { version = "1.9.2", default-features = false }
as_http_status_code = { version = "0.1.0", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["json", "original-uri"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["with-rejection"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
deref-once-lock = { version = "0.1.0", default-features = false }
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
hmac = { version = "0.13.0", default-features = false }
hserver = { version = "0.2.1", default-features = false, features = ["http1", "http2", "tls"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
json-strip-comments = { version = "3.1.2", default-features = false }
lexopt = { version = "0.3.2", default-features = false }
linkme = { version = "0.3.37", optional = true, default-features = false }
log = { version = "0.4.34", default-features = false, features = ["std", "serde"] }
notify = { version = "9.0.0-rc.5", default-features = false, features = ["macos_fsevent", "tokio"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "thread_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "json", "rustls", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std", "raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
socket2 = { version = "0.6.5", default-features = false }
subtle = { version = "2.6.1", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
time = { version = "0.3.55", default-features = false, features = ["parsing", "macros"] }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false, features = ["cors"] }
ts-rs = { version = "12.0.1", default-features = false, features = ["no-serde-warnings", "serde-compat", "serde-json-impl"], optional = true }
turso = { version = "0.8.1", default-features = false }
uuid = { version = "1.26.1", default-features = false, features = ["v4"] }
vec1 = { version = "1.12.1", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
turso_parser = { version = "0.8.1", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
missing_panics_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
