<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Administer a self-hosted JanusGate instance: providers, models, and credentials, over its management API. One artifact administers any instance; nothing is baked into this build."
        />
        <meta
            name="color-scheme"
            content="light dark"
        />
        <script>
            // First-party theme bootstrap: paints the stored theme before the
            // first frame so the app never flashes the wrong one.
            var theme = "system";
            try {
                theme = localStorage.getItem("janusgate-web:theme") || "system";
            } catch (_error) {}
            if (
                theme === "dark" ||
                (theme !== "light" &&
                    matchMedia("(prefers-color-scheme: dark)").matches)
            ) {
                document.documentElement.classList.add("dark");
            }
        </script>
        <!-- Inline icon: the app ships no asset files, so the mark is the same geometry the panel draws. -->
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%23151a1c'/%3E%3Cg%20fill='none'%20stroke='%23d2ae6a'%20stroke-width='1.25'%3E%3Cpath%20d='M2.5%2013.5%20V7.5%20A3.25%203.25%200%200%201%208%207.5%20V13.5'/%3E%3Cpath%20d='M13.5%2013.5%20V7.5%20A3.25%203.25%200%200%200%208%207.5%20V13.5'/%3E%3Cpath%20d='M2.5%2013.5%20H13.5'%20opacity='.55'/%3E%3C/g%3E%3C/svg%3E"
        />
        <title>JanusGate</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
